name: secret-scanning

# This repository is public and its harness authenticates against real
# environments -- Keycloak client secrets, test-user credentials and cluster
# tokens all reach the suite through .env files. .gitignore covers `.env` and
# `.env.*`, but that is a convention, not a control: a credential pasted into a
# journey fixture, a captured response body, or a config file that matches
# neither pattern is committed with nothing objecting. On a public repository
# that is disclosure the moment it is pushed, and rewriting history afterwards
# does not undo it.
#
# Separate from ci.yml rather than a job inside it, because ci.yml is
# deliberately image-free to stay fast and this check is not -- and because
# whether a commit contains a secret should not be answerable by a change to
# the build.
#
# The trigger shape matches ci.yml's on purpose: an unqualified `pull_request:`
# scans pull requests from develop, feat/* and spec/* too, not just those
# targeting one branch.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 because `gitleaks detect` walks git history. Under the
      # default shallow clone it would see a single commit, which defeats the
      # point: the only form of this scan that catches a secret already
      # committed is the one that reads the whole log.
      #
      # Know the blast radius. fetch-depth: 0 fetches every head and tag, and
      # `gitleaks detect` with no --log-opts runs `git log -p --all`, so this
      # scans EVERY BRANCH -- not the pull request, and not even the branch it
      # is running on. Today that is 113 commits against a `develop` whose own
      # history is 12. The consequence: one credential on any unmerged branch
      # turns every pull request in the repository red, including pull requests
      # that touch nothing related, and the blocked author cannot fix it from
      # their own branch.
      #
      # That is deliberate, not an oversight. On a public repository a
      # credential is disclosed wherever it sits, so "it is only on an old
      # branch" is not mitigation, and a scan that ignored those branches would
      # be reporting a safety it does not have. The way out of a block is to
      # rotate the credential and allowlist the fingerprint -- never to narrow
      # the scan. If this ever needs to become per-pull-request, that is
      # --log-opts plus a scheduled full scan, so the coverage moves rather
      # than disappears.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Run the upstream image directly rather than gitleaks-action, whose v2
      # asks organization-owned repositories for a GITLEAKS_LICENSE. Public
      # repositories are exempt, but "probably exempt" is a poor foundation for
      # the one check that stands between a credential and a public git
      # history, and a licence server is a second way for this job to fail for
      # reasons unrelated to the code. The image has no such dependency.
      #
      # Pulled from ghcr.io rather than Docker Hub. Byte-identical artifact --
      # both registries serve digest sha256:75bdb2b2...31caba -- but an
      # anonymous Docker Hub pull is rate-limited by source IP, and shared
      # GitHub-hosted runner egress trips that limit. Leaving it there would
      # subject a required check to failures unrelated to the code, which is
      # the exact instability used above to reject gitleaks-action's licence
      # server; the argument does not get to apply to one and not the other.
      #
      # Pinned by digest for the reason ci.yml pins its actions by commit SHA:
      # a secret-scanning job is the last thing that should be silently swapped
      # under us. The digest below is gitleaks v8.18.4 -- keep the comment and
      # the digest in step when bumping.
      #
      # Bumping it is a MANUAL job. Dependabot's docker ecosystem reads
      # Dockerfiles and compose manifests rather than parsing shell, so a
      # digest inside a `run:` block is invisible to it -- unlike the
      # SHA-pinned actions above, which the github-actions ecosystem does
      # raise pull requests for. Nothing will tell you this pin has aged.
      #
      # Deliberately NOT --user. The v8.18.4 image ends with
      # `git config --global --add safe.directory '*'`, which lands in
      # /root/.gitconfig -- so running as root is what makes git accept a
      # bind-mounted checkout it does not own. Forcing a non-root uid gives the
      # process no passwd entry, that global config is never read, and the
      # allowlist is lost; it then works only while the runner's uid happens to
      # match the workspace owner. Root reads nothing it should not: the mount
      # is :ro and the container is discarded.
      #
      # --redact is the load-bearing flag. Actions logs on a public repository
      # are world-readable, so without it a finding publishes the very
      # credential it just caught.
      - name: gitleaks
        run: |
          # pipefail so gitleaks' exit code survives the pipe through tee, and
          # `|| status=$?` so the step's default `bash -e` does not abort here
          # on a finding -- the assertion below has to run in every case, not
          # only the clean one.
          set -o pipefail
          status=0
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect \
              --source=/repo \
              --redact \
              --verbose \
              --exit-code=1 2>&1 | tee "${RUNNER_TEMP}/gitleaks.log" || status=$?

          # Prove the scan actually happened before trusting a zero exit.
          #
          # gitleaks v8.18.4 FAILS OPEN on the git path. In cmd/detect.go the
          # line `gitCmd, err := sources.NewGitLogCmd(...)` declares a new `err`
          # scoped to that block, `findings, err = detector.DetectGit(gitCmd)`
          # assigns that shadowed copy, and the outer `err` -- still nil -- is
          # what reaches findingSummaryAndExit. So when `git log` fails the tool
          # logs the error, prints "no leaks found" and exits 0. Checking only
          # the exit code would turn a scan that never ran into a green
          # required check, which is worse than having no check at all.
          #
          # Asserting a non-zero "N commits scanned" closes that and the
          # shallow-clone case (which reports 0) in one line, without depending
          # on which failure mode caused it.
          if ! grep -qE '[1-9][0-9]* commits scanned' "${RUNNER_TEMP}/gitleaks.log"; then
            echo "::error::gitleaks did not scan any commits -- treating as a failed scan, not a clean one."
            exit 1
          fi

          exit "$status"
