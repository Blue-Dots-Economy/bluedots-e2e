# Local counterpart to .github/workflows/secret-scanning.yml. The workflow is
# the control -- it runs whether or not a contributor installed anything -- and
# this catches the same thing one step earlier, before a credential is pushed
# to a public remote and disclosed.
#
# One-time setup, documented in the README:
#     pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Same version as the workflow, so a commit that passes here is not
      # rejected by CI for a rule the local hook did not have. `rev` pins the
      # hook definition AND the gitleaks source pre-commit builds from, which
      # the gitleaks-docker variant would not: its entry at this tag is the
      # unpinned `zricethezav/gitleaks` tag, i.e. whatever :latest happens to
      # be that day.
      #
      # The hook is `gitleaks git --pre-commit --staged`, which scans what is
      # about to be committed rather than history -- history is the workflow's
      # job. --redact is already in the upstream entry, so a finding never
      # prints the secret into the terminal (or a shared terminal recording).
      #
      # v8.30.1, not v8.18.4, and the version is load-bearing in two ways.
      # v8.18.4 FAILS OPEN on the git path: a shadowed `err` in cmd/detect.go
      # meant a failed `git log` printed "no leaks found" and exited 0, and the
      # hook has no assertion to catch that the way the workflow does. It also
      # stored every .gitleaksignore line verbatim, so a `# reason` line became
      # a bogus fingerprint; v8.30.1 trims and skips comment lines properly.
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # gitleaks' rules are pattern- and entropy-based; a PEM block is neither
      # reliably. This is the cheap, exact check for the one credential shape
      # most likely to arrive as a file rather than a string.
      - id: detect-private-key

      # A committed .p12/.jks keystore or a captured response dump is both a
      # disclosure and unremovable from a public history.
      #
      # Kept at the 500 KB default, but know the real headroom: the largest
      # tracked file is NOT the lockfile (48 KB) -- it is the generated client
      # src/clients/generated/aggregator-dpg.ts at 252 KB, with signals-dpg.ts
      # behind it at 123 KB. That is roughly 2x of room, not 10x, on files that
      # grow with the providers' OpenAPI specs every time
      # `pnpm clients:generate` runs. If a regeneration ever trips this hook,
      # the file is legitimate and the ceiling is the thing to discuss -- do
      # not reach for `git commit --no-verify`.
      - id: check-added-large-files

      # Not a secret check. A committed conflict marker means the file was not
      # read before staging, which is exactly how a credential left in a
      # resolved .env ends up in a commit.
      - id: check-merge-conflict
