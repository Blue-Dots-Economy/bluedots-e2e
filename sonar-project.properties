sonar.organization=blue-dots-economy
sonar.projectKey=Blue-Dots-Economy_bluedots-e2e
sonar.projectName=bluedots-e2e
sonar.sourceEncoding=UTF-8

# The harness is one project. Tests live beside the code they cover
# (src/**/*.test.ts) or under tests/, and are marked as tests rather than
# split out of sonar.sources.
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/reports/**,**/*.d.ts,docs/**,**/*.md,src/clients/generated/**

sonar.test.inclusions=**/*.test.ts,tests/**

# Generated from provider OpenAPI specs by `pnpm clients:generate`. Findings
# there are the provider's to fix, and editing the output is pointless: the
# next generate overwrites it.
sonar.coverage.exclusions=**/*.test.ts,tests/**,**/*.config.ts,scripts/**,src/clients/generated/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
